[project]
name = "newmicroscopeapp"
version = "0.1.0"
description = "ScopeFoundry-based mosaic scanning microscope app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scopefoundry>=1.3.0",
    "numpy",
    "pyqt6",
    "pyqtgraph",
    "h5py",
    "zwoasi",
    "pyserial",
    "imageio",
    "ipython",
    "qtconsole",
    "napari>=0.7.1",
    "ashlar>=1.20.0",
    "nano-crucible",
]

[project.scripts]
microscope-app = "microscope_app:main"

[tool.uv]

[tool.uv.sources]
nano-crucible = { git = "https://github.com/MolecularFoundryCrucible/nano-crucible", branch = "dev" }
