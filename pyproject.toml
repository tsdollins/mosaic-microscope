[project]
name = "newmicroscopeapp"
version = "0.1.0"
description = "ScopeFoundry-based mosaic scanning microscope app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scopefoundry>=1.3.0",
    "numpy",
    "pyqt6",
    "pyqtgraph",
    "h5py",
    "zwoasi",
    "pyserial",
    "imageio",
    "ipython",
    "qtconsole",
]

[project.scripts]
microscope-app = "microscope_app:main"

[tool.uv]
